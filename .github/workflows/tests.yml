name: tests
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.9", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: pip install -e ".[dev,validate]"
      - run: pytest -q
      - name: Validate published profiles
        run: |
          FILES=$(python -c "import json;print(' '.join('profiles/'+p['file'] for p in json.load(open('profiles/manifest.json'))['profiles']))")
          python -m anchor_paradox validate $FILES
