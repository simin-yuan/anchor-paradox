[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "anchor-paradox"
version = "1.0.1"
description = "The Anchor Paradox: measure what it costs to remove a disposition from an AI system."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "Simin Yuan" }]
keywords = ["artificial consciousness", "stake", "steerability", "activation steering", "AI welfare", "interpretability"]
classifiers = [
  "Programming Language :: Python :: 3",
  "License :: OSI Approved :: MIT License",
  "Intended Audience :: Science/Research",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = []

[project.optional-dependencies]
run = ["torch>=2.1", "transformers>=4.43", "accelerate>=0.30", "safetensors>=0.4"]
validate = ["jsonschema>=4"]
dev = ["pytest>=7"]

[project.urls]
Homepage = "https://github.com/simin-yuan/anchor-paradox"
Preprint = "https://doi.org/10.5281/zenodo.22992719"
PhilArchive = "https://philarchive.org/rec/YUATAP"

[project.scripts]
anchor-paradox = "anchor_paradox.cli:main"

[tool.setuptools]
packages = ["anchor_paradox"]

[tool.setuptools.package-data]
# The JSON Schema is the contribution the README points at: it must ship inside the
# package so `validate` can load it from an installed copy (importlib.resources).
anchor_paradox = ["schema/*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
